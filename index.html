<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>硬幣滾動悖論模擬器｜Coin Rotation Paradox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>硬幣滾動悖論模擬器</h1>
          <p class="subtitle">
            觀察外圍硬幣繞著中心硬幣純滾動一圈時，為什麼自轉圈數總是多出 1 圈
          </p>
        </div>
      </header>

      <section class="top-controls" aria-label="滾動控制">
        <div class="card">
          <h2 class="card-title">滾動控制</h2>
          <div class="button-row">
            <button id="playPauseBtn" class="btn btn-primary" type="button">
              播放
            </button>
            <button id="resetBtn" class="btn btn-secondary" type="button">
              重置
            </button>
          </div>
          <div class="slider-group">
            <div class="slider-header">
              <label for="angleSlider">公轉角度</label>
              <span id="angleReadout" class="mono-value">0.0°</span>
            </div>
            <input
              id="angleSlider"
              type="range"
              min="0"
              max="360"
              step="0.5"
              value="0"
            />
          </div>
        </div>
      </section>

      <main class="main-layout">
        <section class="canvas-panel" aria-label="硬幣滾動模擬畫布">
          <div class="canvas-wrapper">
            <canvas id="simCanvas"></canvas>
            <div class="canvas-counter" aria-live="polite">
              <span class="counter-label">目前累積轉動</span>
              <span id="rotationCounter" class="counter-value">0.00 圈</span>
            </div>
            <div class="canvas-hint">可直接拖曳外圍硬幣，或使用上方滑桿與播放控制</div>
          </div>
          <div class="legend-bar">
            <span class="legend-item">
              <span class="legend-swatch swatch-red"></span>
              紅色指針：硬幣自轉方向
            </span>
            <span class="legend-item">
              <span class="legend-swatch swatch-green"></span>
              綠色虛線：正上方參考線
            </span>
            <span class="legend-item">
              <span class="legend-swatch swatch-orbit"></span>
              圓心軌道與每圈里程碑
            </span>
          </div>
        </section>

        <aside class="control-panel" aria-label="硬幣選擇與公式計算">
          <div class="card">
            <h2 class="card-title">硬幣選擇</h2>
            <div class="coin-select-grid">
              <div class="field-group">
                <label for="centerCoinSelect">中間固定硬幣 (半徑 R)</label>
                <select id="centerCoinSelect"></select>
              </div>
              <div class="field-group">
                <label for="outerCoinSelect">外圍滾動硬幣 (半徑 r)</label>
                <select id="outerCoinSelect"></select>
              </div>
            </div>
          </div>

          <div class="card formula-card">
            <h2 class="card-title">倍數與公式計算</h2>
            <div class="stat-row">
              <span class="stat-label">半徑比例 (R : r)</span>
              <span id="ratioReadout" class="mono-value">1.00 : 1.00</span>
            </div>
            <div class="formula-box">
              <div class="formula-label">總自轉圈數公式</div>
              <div id="formulaReadout" class="formula-text">
                1 (公轉) + (1.00 ÷ 1.00) = <strong>2.00 圈</strong>
              </div>
            </div>
          </div>
        </aside>
      </main>
      <footer style="text-align:center;padding:16px 0 4px;font-size:12px;color:#64748b;">
        <div>👋 <a href="https://herman917.github.io/herman-home/" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;">https://herman917.github.io/herman-home/</a></div>
        <div style="margin-top:4px;">在線人數: 1028</div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
